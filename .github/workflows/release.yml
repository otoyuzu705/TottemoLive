name: Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  build:
    needs: validate
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
  checksums:
    name: Prepare release checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: TottemoLive-*
          merge-multiple: true
          path: dist
      - name: Verify packages and generate checksums
        working-directory: dist
        shell: bash
        run: |
          for target in windows-amd64 macos-amd64 macos-arm64; do
            test -f "TottemoLive-$target.zip"
            sha256sum --check "TottemoLive-$target.zip.sha256"
          done
          sha256sum TottemoLive-*.zip > SHA256SUMS
      - name: Save release checksums
        uses: actions/upload-artifact@v7
        with:
          name: TottemoLive-release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
