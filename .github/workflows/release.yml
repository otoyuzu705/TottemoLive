name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: TottemoLive-*
          merge-multiple: true
          path: dist
      - name: Verify packages and generate checksums
        working-directory: dist
        shell: bash
        run: |
          for target in windows-amd64 macos-amd64 macos-arm64; do
            test -f "TottemoLive-$target.zip"
            sha256sum --check "TottemoLive-$target.zip.sha256"
          done
          sha256sum TottemoLive-*.zip > SHA256SUMS
      - name: Create draft, upload assets, then publish
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "TottemoLive $RELEASE_TAG" --generate-notes TottemoLive-*.zip SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
