name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validate and build on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Linux build and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Test release tooling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check, test and build frontend
        working-directory: frontend
        run: |
          npm run check
          npm test
          npm run build
      - name: Test and vet Go
        run: |
          go test -tags webkit2_41 ./... -count=1 -timeout 10m
          go vet -tags webkit2_41 ./...
      - name: Race detector for parallel DSP
        run: go test -race -short ./internal/dsp ./internal/render -count=1 -timeout 25m
      - name: Install matching Wails CLI
        run: |
          wails_version=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          go install "github.com/wailsapp/wails/v2/cmd/wails@$wails_version"
      - name: Build Linux desktop app
        run: wails build -clean -m -nosyncgomod -trimpath -tags webkit2_41 -platform linux/amd64
      - name: Archive CI build
        run: |
          mkdir -p dist
          tar -czf dist/TottemoLive-ci-linux-amd64.tar.gz -C build/bin TottemoLive
          cd dist
          sha256sum TottemoLive-ci-linux-amd64.tar.gz > TottemoLive-ci-linux-amd64.tar.gz.sha256
      - name: Upload CI build
        uses: actions/upload-artifact@v7
        with:
          name: TottemoLive-ci-linux-amd64
          path: dist/TottemoLive-ci-linux-amd64.tar.gz*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
